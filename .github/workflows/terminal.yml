name: Atualizar arte do perfil

on:
  push:
    paths:
      - "art.txt"
      - "generate.mjs"
      - ".github/workflows/terminal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerar SVG
        run: node generate.mjs
      - name: Publicar SVG atualizado
        run: |
          if ! git diff --quiet -- terminal.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add terminal.svg
            git commit -m "Atualiza terminal SVG a partir do gerador"
            git push
          fi
